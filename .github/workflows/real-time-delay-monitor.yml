name: Real-Time Delay Monitor

on:
  schedule:
    # Every 5 minutes from 10:00 AM - 9:55 PM PT
    # PT is UTC-7, so 10 AM PT = 5 PM UTC, 10 PM PT = 5 AM UTC next day
    - cron: '*/5 17-4 * * *'  # 5 PM - 4:55 AM UTC (covers 10 AM - 9:55 PM PT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-delays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Monitor game delays and status changes
        env:
          SLACK_WEBHOOK_URL_HIGH_RISK: ${{ secrets.SLACK_WEBHOOK_URL_HIGH_RISK }}
        run: python src/mls_game_status_monitor.py
