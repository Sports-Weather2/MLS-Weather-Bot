# This workflow has been disabled as of Aug 2, 2026
# Functionality consolidated into weather-update-v2.yml to reduce over-alerting
# System status is now included in the main dashboard message

name: MLS Game Status Monitor

# DISABLED - See note above
# on:
#   schedule:
#     - cron: '0 14 * * *'  # 7 AM PT (DISABLED - consolidated into weather-update-v2.yml)
#   workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Post status update
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: python src/mls_game_status_monitor.py
